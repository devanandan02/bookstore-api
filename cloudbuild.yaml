steps:
  # ── STEP 1: Build the Docker image ───────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - build
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/bookstore-registry/catalog-service:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/bookstore-registry/catalog-service:latest'
      - '.'

  # ── STEP 2: Push image to Artifact Registry ───────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    waitFor: ['build']
    args:
      - push
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/bookstore-registry/catalog-service'

  # ── STEP 3: Deploy to Cloud Run ───────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    id: deploy
    waitFor: ['push']
    args:
      - run
      - deploy
      - bookstore-live
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/bookstore-registry/catalog-service:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/bookstore-registry/catalog-service:$COMMIT_SHA'

timeout: '600s'
options:
  logging: CLOUD_LOGGING_ONLY